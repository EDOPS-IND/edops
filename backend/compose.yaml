services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edops
      POSTGRES_PASSWORD: edops_dev
      POSTGRES_DB: edops
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edops -d edops"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
